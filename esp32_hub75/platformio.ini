[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ 6.5.0
board = adafruit_matrixportal_esp32s3
framework = arduino

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/Adafruit GFX Library @ 1.12.6
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#a8b172aee5710c7ab5e8c049cd001703b73f1eb9
    h2zero/NimBLE-Arduino @ 2.5.1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMATRIX_WIDTH=64
    -DMATRIX_HEIGHT=32
    -DCHAIN_LENGTH=1

board_build.partitions = partitions.csv
board_build.embed_txtfiles = certs/backend.pem
