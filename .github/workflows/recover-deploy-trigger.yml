name: Recover missed deploy trigger

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: recover-deploy-trigger
  cancel-in-progress: false

jobs:
  dispatch-deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deploy activity
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eu
          active=$(gh run list --workflow deploy.yml --branch main --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "active=${active}"
          if [ "${active}" -gt 0 ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"
          else
            echo "busy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check deployed component revision
        id: check
        if: steps.deploy.outputs.busy == 'false'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        shell: bash
        run: |
          set -eu
          key="$RUNNER_TEMP/backend-key"
          printf '%s\n' "$SSH_KEY" > "$key"
          chmod 600 "$key"
          live_sha=$(ssh -i "$key" -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/home/ubuntu/ticker_data/backend-control/state.json')
          print(json.loads(path.read_text()).get('processed_revision', '') if path.exists() else Path('/home/ubuntu/RELEASE_SHA').read_text().strip())
          PY
          )
          python tools/deployment_scope.py --deployed "$live_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch backend recovery deploy
        if: steps.deploy.outputs.busy == 'false' && steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main -f recovery_only=true
