name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ota_ticker_id:
        description: "Request OTA for one mini ticker after deploy"
        required: false
        default: ""
      recovery_only:
        description: "Redeploy the backend only after a missed deploy"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Detect which parts of the repo changed
  # ─────────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:    ${{ steps.filter.outputs.backend }}
      controller: ${{ steps.filter.outputs.controller }}
      mini:       ${{ steps.filter.outputs.mini }}
      fresh:      ${{ steps.freshness.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/deployment-paths.json

      - name: Verify current main
        id: freshness
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale push ${GITHUB_SHA}. Current main is ${current_sha}."
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy backend to server (only when backend files changed)
  # ─────────────────────────────────────────────────────────────────────────
  verify-runtime:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.fresh == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install -r requirements-backend.txt pytest 'ruff>=0.14,<0.15' 'mypy>=1.18,<2'
      - name: Compile Python sources
        run: python -m compileall -q sports_ticker ticker_core
      - name: Check Python correctness
        run: python -m ruff check sports_ticker ticker_core
      - name: Check scoped Python types
        run: python -m mypy
      - name: Verify approved public demo assets
        run: python tools/verify_public_demo.py
      - name: Verify public demo route
        run: python -m pytest -q tests/rewrite/api/test_public_demo.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Verify shared Mini payload fields
        run: python tools/generate_mini_fields.py --check
      - name: Verify shared Mini drawing data
        run: python tools/generate_mini_ui.py --check
      - name: Verify Mini sprite wire and cache
        run: |
          python tools/mini_sprite_vectors.py --output artifacts/mini-sprite-vectors
          g++ -std=c++17 -O1 -Iesp32_hub75/src/mini/assets tests/native/mini_sprite_cache.cpp -ldl -o /tmp/mini-sprite-check
          /tmp/mini-sprite-check artifacts/mini-sprite-vectors /tmp/mini-sprite-cache
      - name: Compare pane render paths
        run: python tools/benchmarks/pi_pane_composition.py --frames 1000 --output artifacts/pane-composition
      - name: Verify Mini display metrics and frame mirror
        run: |
          g++ -std=c++11 -O1 -Iesp32_hub75/src/mini/platform tests/native/mini_display_metrics.cpp -o /tmp/mini-display-check
          /tmp/mini-display-check
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  build-mini-firmware:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.fresh == 'true' && (needs.changes.outputs.mini == 'true' || (github.event_name == 'workflow_dispatch' && inputs.recovery_only != true))
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build mini firmware
        run: pio run -d esp32_hub75 -e esp32s3
      - name: Verify Mini response buffer and hockey protocol
        run: |
          g++ -std=c++17 -O1 -Iesp32_hub75/src/mini/protocol -Iesp32_hub75/.pio/libdeps/esp32s3/ArduinoJson/src tests/native/mini_hockey_panes.cpp -o /tmp/mini-hockey-check
          /tmp/mini-hockey-check tests/rewrite/debug/mini_hockey_panes.json
          g++ -std=c++17 -O1 -Iesp32_hub75/src/mini/protocol -Iesp32_hub75/.pio/libdeps/esp32s3/ArduinoJson/src tests/native/mini_dns_answer.cpp -o /tmp/mini-dns-check
          /tmp/mini-dns-check
          g++ -std=c++11 -O1 -Iesp32_hub75/src/mini/platform tests/native/mini_firmware_validation.cpp -o /tmp/mini-firmware-check
          /tmp/mini-firmware-check
          g++ -std=c++17 -O1 -Iesp32_hub75/src/mini/assets tests/native/mini_logo_residency.cpp -o /tmp/mini-logo-check
          /tmp/mini-logo-check
          g++ -std=c++11 -O1 -Iesp32_hub75/src/mini/platform tests/native/mini_station_retry.cpp -o /tmp/mini-station-check
          /tmp/mini-station-check
          g++ -std=c++11 -O1 -Iesp32_hub75/src/mini/platform tests/native/mini_transfer_deadline.cpp -o /tmp/mini-deadline-check
          /tmp/mini-deadline-check
          g++ -std=c++17 -O1 -Iesp32_hub75/src/mini/protocol -Iesp32_hub75/.pio/libdeps/esp32s3/ArduinoJson/src tests/native/mini_device_payload.cpp esp32_hub75/src/mini/protocol/device_payload.cpp -o /tmp/mini-payload-check
          /tmp/mini-payload-check
      - name: Read mini firmware version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*MINI_FIRMWARE_VERSION\[\].*= "\([^"]*\)";.*/\1/p' esp32_hub75/src/mini/platform/config.h)
          test -n "$VERSION"
          cp esp32_hub75/.pio/build/esp32s3/firmware.bin mini-firmware.bin
          cp esp32_hub75/.pio/build/esp32s3/firmware.elf mini-firmware.elf
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-firmware
          path: |
            mini-firmware.bin
            mini-firmware.elf
          if-no-files-found: error

  deploy-mini-firmware:
    runs-on: ubuntu-latest
    needs: [changes, build-mini-firmware, verify-runtime]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.fresh == 'true' && (needs.changes.outputs.mini == 'true' || (github.event_name == 'workflow_dispatch' && inputs.recovery_only != true)) && needs.build-mini-firmware.result == 'success' && needs.verify-runtime.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mini-firmware
          path: mini-firmware

      - name: Flatten mini firmware artifact
        run: mv mini-firmware/mini-firmware.bin mini-firmware.bin

      - name: Copy mini firmware to server
        uses: appleboy/scp-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          source:   "mini-firmware.bin"
          target:   "/home/${{ secrets.SSH_USER }}/firmware-staging/"

      - name: Install firmware manifest and restart backend
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.SSH_USER }}/

            test -f .env
            mkdir -p firmware firmware-staging
            test -s firmware-staging/mini-firmware.bin
            mv -f firmware-staging/mini-firmware.bin "firmware/${{ needs.build-mini-firmware.outputs.version }}.bin"
            FIRMWARE_PATH="firmware/${{ needs.build-mini-firmware.outputs.version }}.bin"
            FIRMWARE_SIZE=$(stat -c%s "$FIRMWARE_PATH")
            FIRMWARE_SHA256=$(sha256sum "$FIRMWARE_PATH" | awk '{print $1}')
            test "$FIRMWARE_SIZE" -ge 65536
            test "${#FIRMWARE_SHA256}" -eq 64

            awk '!/^TICKER_FIRMWARE_DIR=/ && !/^TICKER_MINI_FIRMWARE_/' .env > .env.next
            cat >> .env.next <<EOF
            TICKER_FIRMWARE_DIR=/home/${{ secrets.SSH_USER }}/firmware
            TICKER_MINI_FIRMWARE_VERSION=${{ needs.build-mini-firmware.outputs.version }}
            TICKER_MINI_FIRMWARE_TARGET=esp32s3
            TICKER_MINI_FIRMWARE_HARDWARE=esp32-s3
            TICKER_MINI_FIRMWARE_URL=https://ticker.mattdicks.org/firmware/${{ needs.build-mini-firmware.outputs.version }}.bin
            TICKER_MINI_FIRMWARE_SIZE=$FIRMWARE_SIZE
            TICKER_MINI_FIRMWARE_SHA256=$FIRMWARE_SHA256
            EOF
            mv -f .env.next .env
            chmod 600 .env

            if [ "${{ needs.changes.outputs.backend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "The backend deployment will activate the firmware manifest."
            else
              if [ "${{ needs.changes.outputs.backend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Backend code deployment will restart the service after copying files."
            else
              sudo systemctl restart ticker
            fi
              sudo systemctl status ticker --no-pager
            fi

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [changes, verify-runtime, deploy-mini-firmware]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.fresh == 'true' && (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') && needs.verify-runtime.result == 'success' && (needs.deploy-mini-firmware.result == 'success' || needs.deploy-mini-firmware.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Generate VERSION file
        run: |
          SHA=$(git rev-parse --short=12 HEAD)
          echo "${SHA}" > VERSION
          echo "Version: ${SHA}"

      - name: Prepare shared renderer ownership
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd "/home/${{ secrets.SSH_USER }}"
            mkdir -p ticker_core
            test "$(readlink -f ticker_core)" = "/home/${{ secrets.SSH_USER }}/ticker_core"
            sudo chown -R --no-dereference "${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }}" ticker_core

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          source:   "sports_ticker/**,ticker_core/**,requirements.txt,requirements-backend.txt,ticker.service,VERSION"
          target:   "/home/${{ secrets.SSH_USER }}/"

      - name: Write backend environment and restart backend
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /home/${{ secrets.SSH_USER }}/

            test -f .env
            awk '/^TICKER_FIRMWARE_DIR=/ || /^TICKER_MINI_FIRMWARE_/' .env > .env.firmware
            cat > .env.next <<EOF
            FINNHUB_KEY_1=${{ secrets.FINNHUB_KEY_1 }}
            FINNHUB_KEY_2=${{ secrets.FINNHUB_KEY_2 }}
            FINNHUB_KEY_3=${{ secrets.FINNHUB_KEY_3 }}
            FINNHUB_KEY_4=${{ secrets.FINNHUB_KEY_4 }}
            FINNHUB_KEY_5=${{ secrets.FINNHUB_KEY_5 }}
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_CALLBACK_URI=${{ secrets.SPOTIFY_CALLBACK_URI }}
            SPOTIFY_APP_RETURN_URI=${{ secrets.SPOTIFY_APP_RETURN_URI }}
            SPOTIFY_TOKEN_ENCRYPTION_KEY=${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEY }}
            TICKER_DATABASE_PATH=/home/${{ secrets.SSH_USER }}/ticker_data/ticker-v2.sqlite3
            TICKER_INITIAL_TICKER_ID=722c59f4-fce3-4735-b072-faaa2f579a0a
            TICKER_INITIAL_TICKER_NAME=Personal Ticker
            TICKER_INITIAL_TICKER_PAIRED=true
            TICKER_VERIFY_TLS=true
            TICKER_DEPLOY_TOKEN=${{ secrets.POOP_ADMIN_PASSWORD }}
            EOF
            cat .env.firmware >> .env.next
            rm -f .env.firmware
            mv -f .env.next .env
            chmod 600 .env
            sudo rm -f /etc/systemd/system/ticker.service.d/oci.conf
            sudo cp "/home/${{ secrets.SSH_USER }}/ticker.service" /etc/systemd/system/ticker.service
            sudo systemctl daemon-reload

            # ── Install deps ──────────────────────────────────────────────
            pip3 install -r requirements-backend.txt --break-system-packages 2>/dev/null \
              || pip3 install -r requirements-backend.txt

            # ── Restart backend ───────────────────────────────────────────
            echo "Restarting ticker (backend)..."
            sudo systemctl restart ticker
            healthy=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 2 http://127.0.0.1:5000/api/v2/health >/dev/null; then
                healthy=true
                break
              fi
              sleep 1
            done
            if [ "$healthy" != "true" ]; then
              echo "Backend did not pass its HTTP readiness check."
              exit 1
            fi
            sudo systemctl status ticker --no-pager

  request-mini-ota:
    runs-on: ubuntu-latest
    needs: [changes, build-mini-firmware, deploy-mini-firmware, deploy-backend, verify-runtime]
    if: always() && needs.changes.outputs.fresh == 'true' && needs.deploy-mini-firmware.result == 'success' && needs.verify-runtime.result == 'success' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    steps:
      - name: Request mini OTA
        env:
          OTA_TICKER_ID: ${{ github.event.inputs.ota_ticker_id || 'esp32s3-E47FF1818C58' }}
          OTA_VERSION: ${{ needs.build-mini-firmware.outputs.version }}
          DEPLOY_TOKEN: ${{ secrets.POOP_ADMIN_PASSWORD }}
        run: |
          curl --fail --retry 3 --retry-delay 2 \
            -X POST "https://ticker.mattdicks.org/api/v2/tickers/${OTA_TICKER_ID}/updates" \
            -H "X-Deployment-Token: ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"version\":\"${OTA_VERSION}\"}"

  # ─────────────────────────────────────────────────────────────────────────
  # Signal all Pi tickers to pull the new controller code
  # (only when ticker_controller/** or updater.py changed)
  # ─────────────────────────────────────────────────────────────────────────
  signal-fleet:
    runs-on: ubuntu-latest
    needs: [changes, verify-runtime, deploy-backend]
    if: always() && needs.changes.result == 'success' && needs.verify-runtime.result == 'success' && needs.changes.outputs.fresh == 'true' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') && needs.changes.outputs.controller == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.recovery_only == true)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Send update signal to the personal ticker
        run: |
          echo "Controller code changed — signalling ticker..."
          VERSION=$(git rev-parse HEAD)
          echo "New version: ${VERSION}"
          TICKER_ID="722c59f4-fce3-4735-b072-faaa2f579a0a"
          V2_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://ticker.mattdicks.org/api/v2/tickers/${TICKER_ID}/updates" \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Token: ${{ secrets.POOP_ADMIN_PASSWORD }}" \
            -d "{\"version\":\"${VERSION}\"}")
          if [ "$V2_STATUS" != "201" ]; then
            echo "V2 update request failed with HTTP ${V2_STATUS}."
            exit 1
          fi
          echo "Queued V2 update."
