name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Detect which parts of the repo changed
  # ─────────────────────────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend:    ${{ steps.filter.outputs.backend }}
      controller: ${{ steps.filter.outputs.controller }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'app.py'
              - 'sports_ticker/**'
              - 'requirements.txt'
              - '*.json'
              - 'ticker.service'
            controller:
              - 'ticker_controller/**'
              - 'ticker_core/**'
              - 'updater.py'
              - 'ticker-controller.service'
              - 'setup.sh'

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy backend to server (only when backend files changed)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [changes, signal-fleet]
    if: |
      needs.changes.outputs.backend == 'true' &&
      (needs.signal-fleet.result == 'success' || needs.signal-fleet.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Generate VERSION file
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format=%cd --date=format:%Y.%m.%d)
          echo "${DATE}|${COUNT}|${SHA}" > VERSION
          echo "Version: ${DATE} · build r${COUNT}+${SHA}"

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          source:   "sports_ticker/**,requirements.txt,ticker.service,VERSION"
          target:   "/home/${{ secrets.SSH_USER }}/"

      - name: Write .env and restart backend
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/

            # ── Generate .env ──────────────────────────────────────────────
            echo "FINNHUB_KEY_1=${{ secrets.FINNHUB_KEY_1 }}"           > .env
            echo "FINNHUB_KEY_2=${{ secrets.FINNHUB_KEY_2 }}"          >> .env
            echo "FINNHUB_KEY_3=${{ secrets.FINNHUB_KEY_3 }}"          >> .env
            echo "FINNHUB_KEY_4=${{ secrets.FINNHUB_KEY_4 }}"          >> .env
            echo "FINNHUB_KEY_5=${{ secrets.FINNHUB_KEY_5 }}"          >> .env
            echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}"  >> .env
            echo "SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}" >> .env
            echo "SPOTIFY_CALLBACK_URI=${{ secrets.SPOTIFY_CALLBACK_URI }}" >> .env
            echo "SPOTIFY_APP_RETURN_URI=${{ secrets.SPOTIFY_APP_RETURN_URI }}" >> .env
            echo "SPOTIFY_TOKEN_ENCRYPTION_KEY=${{ secrets.SPOTIFY_TOKEN_ENCRYPTION_KEY }}" >> .env
            echo "TICKER_DATABASE_PATH=/home/${{ secrets.SSH_USER }}/ticker_data/ticker-v2.sqlite3" >> .env
            echo "TICKER_INITIAL_TICKER_ID=722c59f4-fce3-4735-b072-faaa2f579a0a" >> .env
            echo "TICKER_INITIAL_TICKER_NAME=Personal Ticker" >> .env
            echo "TICKER_VERIFY_TLS=true" >> .env
            echo "TICKER_DEPLOY_TOKEN=${{ secrets.POOP_ADMIN_PASSWORD }}" >> .env
            chmod 600 .env
            sudo cp "/home/${{ secrets.SSH_USER }}/ticker.service" /etc/systemd/system/ticker.service
            sudo systemctl daemon-reload

            # ── Install deps ──────────────────────────────────────────────
            pip3 install -r requirements.txt --break-system-packages 2>/dev/null \
              || pip3 install -r requirements.txt

            # ── Restart backend ───────────────────────────────────────────
            echo "Restarting ticker (backend)..."
            sudo systemctl restart ticker
            sudo systemctl status ticker --no-pager

  # ─────────────────────────────────────────────────────────────────────────
  # Signal all Pi tickers to pull the new controller code
  # (only when ticker_controller/** or updater.py changed)
  # ─────────────────────────────────────────────────────────────────────────
  signal-fleet:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.controller == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Send update signal to the personal ticker
        run: |
          echo "Controller code changed — signalling ticker..."
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          VERSION="r${COUNT}+${SHA}"
          echo "New version: ${VERSION}"
          TICKER_ID="722c59f4-fce3-4735-b072-faaa2f579a0a"
          V2_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://ticker.mattdicks.org/api/v2/tickers/${TICKER_ID}/updates" \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Token: ${{ secrets.POOP_ADMIN_PASSWORD }}" \
            -d "{\"version\":\"${VERSION}\"}")
          if [ "$V2_STATUS" = "201" ]; then
            echo "Queued v2 update."
            exit 0
          fi
          echo "v2 endpoint returned HTTP ${V2_STATUS}. Using the one-time legacy cutover signal."
          curl --fail --silent --show-error \
            -X POST https://ticker.mattdicks.org/api/hardware \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"update\",\"ticker_id\":\"all\",\"version\":\"${VERSION}\"}"
