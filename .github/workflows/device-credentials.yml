name: Enroll device credential
on:
  workflow_dispatch:
    inputs:
      ticker_id:
        description: Device identity
        required: true
      token_sha256:
        description: SHA-256 of the device token
        required: true
permissions:
  contents: read
jobs:
  enroll:
    runs-on: ubuntu-latest
    steps:
      - name: Enroll the device hash
        env:
          DEPLOY_TOKEN: ${{ secrets.POOP_ADMIN_PASSWORD }}
          TICKER_ID: ${{ inputs.ticker_id }}
          TOKEN_SHA256: ${{ inputs.token_sha256 }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, urllib.parse
          digest = os.environ["TOKEN_SHA256"]
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Invalid credential hash")
          identity = urllib.parse.quote(os.environ["TICKER_ID"], safe="")
          request = urllib.request.Request(
              f"https://ticker.mattdicks.org/api/v2/tickers/{identity}/device-credential",
              data=json.dumps({"token_sha256": digest}).encode(),
              headers={"X-Deployment-Token": os.environ["DEPLOY_TOKEN"],
                       "Content-Type": "application/json", "User-Agent": "Mozilla/5.0"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          print(json.dumps({"ticker_id": result["ticker_id"], "enrolled": result["enrolled"]}))
          PY
