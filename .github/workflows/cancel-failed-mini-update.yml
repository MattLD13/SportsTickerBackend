name: Cancel failed Mini update
on:
  workflow_dispatch:
    inputs:
      ticker_id:
        required: true
        description: Device identity
      version:
        required: true
        description: Exact failed version to cancel
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@master
        env:
          RECOVERY_TICKER_ID: ${{ inputs.ticker_id }}
          RECOVERY_VERSION: ${{ inputs.version }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: RECOVERY_TICKER_ID,RECOVERY_VERSION
          script: |
            set -eu
            cd /home/${{ secrets.SSH_USER }}
            python3 - <<'PY'
            import json, os, time
            from pathlib import Path
            from sports_ticker.application.composition import BackendApplication
            from sports_ticker.application.state_store import SnapshotStore
            from sports_ticker.fleet import DeviceMetadata, TickerRepository
            repository = TickerRepository(Path.cwd() / "ticker_data/ticker-v2.sqlite3")
            application = BackendApplication(repository, SnapshotStore())
            identity = os.environ["RECOVERY_TICKER_ID"]
            version = os.environ["RECOVERY_VERSION"]
            repository._connection.execute("BEGIN IMMEDIATE")
            record = repository.get_ticker(identity)
            if record is None:
                raise SystemExit("Device is absent")
            metadata = dict(record.device.metadata)
            command = application._find_command(metadata, "update", lambda payload: str(payload.get("version") or "") == version)
            if command:
                application._remove_command(metadata, command["id"])
                metadata["last_update_result"] = {"status": "cancelled_after_rollback", "version": version,
                                                  "running_version": metadata.get("build"), "observed_at": time.time()}
                repository.update_ticker(identity, device=DeviceMetadata(last_seen_at=record.device.last_seen_at, metadata=metadata))
            repository._connection.commit()
            print(json.dumps({"ticker_id": identity, "version": version, "cancelled": bool(command)}))
            application.close()
            PY
