name: Device builds

on:
  push:
    branches: ['main']
    paths:
      - 'esp32_hub75/**'
      - 'TickerControlApp/**'
      - 'docs/contracts/**'
      - 'tests/native/**'
      - 'ticker_core/rendering/pixels.py'
      - 'ticker_core/rendering/style.py'
      - 'tools/generate_mini_ui.py'
      - '.github/workflows/device-builds.yml'
  pull_request:
    paths:
      - 'esp32_hub75/**'
      - 'TickerControlApp/**'
      - 'docs/contracts/**'
      - 'tests/native/**'
      - 'ticker_core/rendering/pixels.py'
      - 'ticker_core/rendering/style.py'
      - 'tools/generate_mini_ui.py'
      - '.github/workflows/device-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build mini firmware
        run: pio run -d esp32_hub75 -e esp32s3
      - name: Check extracted text pixels
        run: |
          g++ -std=c++11 -O1 -Iesp32_hub75/src/mini/rendering tests/native/mini_text_layout.cpp -o /tmp/mini-text-check
          /tmp/mini-text-check
      - name: Check firmware transfer and boot receipts
        run: |
          g++ -std=c++11 -O1 -Iesp32_hub75/src/mini/platform tests/native/mini_firmware_validation.cpp -o /tmp/mini-firmware-check
          /tmp/mini-firmware-check
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            package_configuration: debug
          - configuration: Release
            package_configuration: release
    steps:
      - uses: actions/checkout@v4
      - name: Report Xcode toolchain
        run: xcodebuild -version
      - name: Check state and contract serialization
        run: swift test --package-path TickerControlApp --configuration ${{ matrix.package_configuration }}
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project TickerControlApp/TickerControl.xcodeproj
          -target TickerControl
          -configuration ${{ matrix.configuration }}
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
