name: Device builds

on:
  pull_request:
    paths:
      - 'esp32_hub75/**'
      - 'TickerControlApp/**'
      - '.github/workflows/device-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build mini firmware
        run: pio run -d esp32_hub75 -e esp32s3
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report Xcode toolchain
        run: xcodebuild -version
      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project TickerControlApp/TickerControl.xcodeproj
          -target TickerControl
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
