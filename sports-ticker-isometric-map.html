<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:">
  <title>Isometric Codebase Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #f3efe3;
      --paper-2: #e9e2d1;
      --ink: #242b2a;
      --muted: #69706d;
      --line: #9b9a8d;
      --accent: #d24d35;
      --panel: rgba(249, 246, 237, 0.94);
      --shadow: rgba(47, 42, 31, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .shell {
      min-width: 1180px;
      height: 100vh;
      padding-top: 72px;
      background:
        linear-gradient(rgba(69, 77, 71, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(69, 77, 71, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 18px 18px;
    }

    .topbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 72px;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) auto auto;
      align-items: center;
      gap: 22px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(63, 69, 66, 0.34);
      background: rgba(246, 242, 232, 0.96);
      box-shadow: 0 4px 18px rgba(51, 48, 39, 0.07);
      z-index: 10;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--ink);
      background:
        repeating-linear-gradient(135deg, transparent 0 4px, rgba(36, 43, 42, 0.15) 4px 5px),
        #dfd7c2;
      box-shadow: 3px 3px 0 rgba(36, 43, 42, 0.16);
      font-size: 20px;
    }

    .brand-copy { min-width: 0; }

    .brand h1 {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 3px 0 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .stats {
      display: flex;
      align-items: stretch;
      border-left: 1px solid rgba(63, 69, 66, 0.25);
    }

    .stat {
      min-width: 80px;
      padding: 3px 14px;
      border-right: 1px solid rgba(63, 69, 66, 0.25);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 15px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .control {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(36, 43, 42, 0.5);
      border-radius: 2px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .control:hover,
    .control:focus-visible {
      outline: none;
      background: var(--ink);
      color: var(--paper);
    }

    .control.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fffaf0;
    }

    .app {
      height: calc(100vh - 72px);
      min-height: 0;
      display: grid;
      grid-template-columns: 258px minmax(560px, 1fr) 342px;
    }

    .rail,
    .detail {
      min-height: 0;
      overflow: auto;
      background: var(--panel);
      backdrop-filter: blur(7px);
      scrollbar-width: thin;
      scrollbar-color: rgba(36, 43, 42, 0.28) transparent;
    }

    .rail {
      border-right: 1px solid rgba(63, 69, 66, 0.34);
      padding: 20px 14px 30px;
    }

    .detail {
      border-left: 1px solid rgba(63, 69, 66, 0.34);
      padding: 24px 24px 38px;
    }

    .rail-heading,
    .eyebrow {
      margin: 0 0 15px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .group { margin-bottom: 19px; }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 7px 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .swatch {
      width: 9px;
      height: 9px;
      border: 1px solid rgba(36, 43, 42, 0.46);
      transform: rotate(45deg);
    }

    .structure-link {
      width: 100%;
      display: grid;
      grid-template-columns: 31px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 37px;
      margin: 2px 0;
      padding: 4px 6px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .structure-link:hover,
    .structure-link:focus-visible,
    .structure-link.active {
      outline: none;
      border-color: rgba(36, 43, 42, 0.35);
      background: rgba(255, 252, 244, 0.8);
      box-shadow: 2px 2px 0 rgba(36, 43, 42, 0.09);
    }

    .structure-link.active { border-left: 3px solid var(--accent); }

    .code-chip {
      width: 28px;
      height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(36, 43, 42, 0.5);
      background: var(--chip, #ddd4bf);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
    }

    .structure-link .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }

    .structure-link .loc {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9px;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        repeating-linear-gradient(30deg, transparent 0 12px, rgba(65, 75, 69, 0.035) 12px 13px),
        repeating-linear-gradient(150deg, transparent 0 12px, rgba(65, 75, 69, 0.028) 12px 13px),
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.78), rgba(230, 223, 207, 0.52));
    }

    #map {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .ground-line {
      fill: none;
      stroke: rgba(66, 73, 69, 0.11);
      stroke-width: 1;
    }

    .zone-label {
      fill: rgba(52, 61, 57, 0.28);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .edge-line {
      fill: none;
      stroke: rgba(54, 64, 59, 0.43);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .edge-line.flow { stroke: rgba(56, 72, 65, 0.68); }
    .edge-line.dashed { stroke-dasharray: 5 5; stroke: rgba(83, 81, 70, 0.5); }
    .edge-line.active { stroke: var(--accent); stroke-width: 3; }
    .edge-line.trace-complete { stroke: #aa6d32; stroke-width: 2.2; opacity: 0.9; }
    .edge-line.trace-current { stroke: var(--accent); stroke-width: 4; opacity: 1; }

    .inside-flow-label {
      fill: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-anchor: middle;
      pointer-events: none;
    }

    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 12;
      pointer-events: stroke;
      cursor: help;
    }

    .flow-dot {
      fill: #c54831;
      stroke: #fff8e8;
      stroke-width: 1.2;
      pointer-events: all;
    }

    .structure {
      cursor: pointer;
      transition: opacity 140ms ease;
    }

    .structure:focus-visible { outline: none; }
    .structure .face { stroke: rgba(31, 39, 36, 0.62); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .structure .top { filter: url(#paper-shadow); }

    .structure:hover .face,
    .structure.active .face,
    .structure:focus-visible .face {
      stroke: var(--accent);
      stroke-width: 2.4;
    }

    .structure.dimmed { opacity: 0.28; }

    .structure.trace-complete .face {
      stroke: #aa6d32;
      stroke-width: 2.1;
    }

    .structure.trace-current {
      filter: drop-shadow(0 0 6px rgba(210, 77, 53, 0.5));
    }

    .structure.trace-current .face {
      stroke: var(--accent);
      stroke-width: 3.2;
    }

    .block-code {
      fill: #28302d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 900;
      text-anchor: middle;
      pointer-events: none;
    }

    .block-loc {
      fill: rgba(40, 48, 45, 0.67);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 8px;
      font-weight: 700;
      text-anchor: middle;
      pointer-events: none;
    }

    .external-line {
      fill: none;
      stroke: rgba(78, 79, 70, 0.53);
      stroke-width: 1.2;
      stroke-dasharray: 4 5;
    }

    .external-card {
      fill: rgba(249, 246, 237, 0.96);
      stroke: rgba(58, 64, 61, 0.58);
      stroke-width: 1;
    }

    .external-name {
      fill: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .external-pay {
      fill: var(--muted);
      font-size: 8px;
    }

    .tooltip {
      position: fixed;
      z-index: 30;
      width: 240px;
      padding: 12px 13px;
      border: 1px solid var(--ink);
      background: #fffaf0;
      box-shadow: 5px 5px 0 rgba(36, 43, 42, 0.14);
      pointer-events: none;
      opacity: 0;
      transform: translate(10px, 10px);
    }

    .tooltip.show { opacity: 1; }

    .tooltip strong {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .tooltip span {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .detail h2 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      line-height: 1.05;
      letter-spacing: -0.025em;
    }

    .detail-meta {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .detail-meta span {
      padding: 4px 7px;
      border: 1px solid rgba(36, 43, 42, 0.32);
      background: rgba(255, 252, 244, 0.65);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .detail-section {
      padding: 18px 0;
      border-top: 1px solid rgba(63, 69, 66, 0.24);
    }

    .detail-section h3 {
      margin: 0 0 9px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .detail-section p,
    .detail-section li {
      margin: 0;
      color: #4f5753;
      font-size: 12px;
      line-height: 1.65;
    }

    .detail-section ul {
      margin: 0;
      padding-left: 18px;
    }

    .inside-button {
      width: 100%;
      min-height: 44px;
      margin-top: 17px;
      border: 1px solid var(--ink);
      background:
        repeating-linear-gradient(135deg, transparent 0 6px, rgba(255, 255, 255, 0.15) 6px 7px),
        var(--ink);
      color: #fffaf0;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .inside-button:hover,
    .inside-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .trace-card {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 20px;
      z-index: 8;
      display: none;
      grid-template-columns: 130px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px 18px;
      min-height: 148px;
      padding: 14px 16px 12px;
      border: 1px solid var(--ink);
      background: rgba(255, 250, 240, 0.96);
      box-shadow: 6px 6px 0 rgba(36, 43, 42, 0.14);
    }

    .trace-card.show { display: grid; }

    .trace-count {
      min-width: 120px;
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 900;
    }

    .trace-count small,
    .trace-count span {
      display: block;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .trace-count b {
      display: block;
      margin: 2px 0 3px;
      font-size: 22px;
    }

    .trace-copy strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
    }

    .trace-copy span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .trace-actions { display: flex; gap: 7px; }

    .trace-actions button {
      min-width: 72px;
      height: 34px;
      padding: 0 9px;
      border: 1px solid rgba(36, 43, 42, 0.48);
      background: transparent;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .trace-actions button:hover,
    .trace-actions button:focus-visible { outline: none; background: var(--ink); color: var(--paper); }

    .trace-actions button:disabled { cursor: default; opacity: 0.3; }

    .trace-timeline {
      position: relative;
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(var(--trace-count), minmax(42px, 1fr));
      gap: 5px;
      padding-top: 13px;
      border-top: 1px solid rgba(63, 69, 66, 0.24);
    }

    .trace-timeline::before {
      position: absolute;
      top: 27px;
      right: 22px;
      left: 22px;
      height: 2px;
      background: rgba(36, 43, 42, 0.18);
      content: "";
    }

    .trace-step {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 4px;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .trace-dot {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(36, 43, 42, 0.35);
      border-radius: 50%;
      background: #fffaf0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 9px;
      font-weight: 900;
    }

    .trace-step.complete .trace-dot { border-color: #aa6d32; background: #aa6d32; color: #fffaf0; }
    .trace-step.current .trace-dot { border-color: var(--accent); background: var(--accent); color: #fffaf0; box-shadow: 0 0 0 4px rgba(210, 77, 53, 0.16); }

    .trace-step-label {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 8px;
      font-weight: 800;
    }

    .trace-step.current .trace-step-label { color: var(--accent); }
    .trace-step:hover .trace-step-label,
    .trace-step:focus-visible .trace-step-label { color: var(--ink); }
    .trace-step:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

    .inside-title {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 700;
    }

    .inside-note {
      fill: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .inside-boundary {
      fill: rgba(255, 252, 244, 0.3);
      stroke: rgba(56, 64, 60, 0.36);
      stroke-width: 1.2;
      stroke-dasharray: 8 6;
    }

    .inside-back {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 9;
      display: none;
    }

    .inside-back.show { display: block; }

    .legend {
      position: absolute;
      right: 16px;
      top: 15px;
      display: flex;
      gap: 13px;
      padding: 7px 9px;
      border: 1px solid rgba(36, 43, 42, 0.22);
      background: rgba(249, 246, 237, 0.72);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 8px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .legend i {
      width: 18px;
      height: 2px;
      display: inline-block;
      margin-right: 5px;
      vertical-align: middle;
      background: rgba(56, 72, 65, 0.68);
    }

    .legend i.dashed {
      background: repeating-linear-gradient(90deg, rgba(83, 81, 70, 0.7) 0 4px, transparent 4px 7px);
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🗺️</div>
        <div class="brand-copy">
          <h1 id="page-title"></h1>
          <p id="page-subtitle"></p>
        </div>
      </div>
      <div class="stats" id="stats" aria-label="Repository statistics"></div>
      <div class="top-actions">
        <button class="control" id="overview-button" type="button">Overview</button>
        <button class="control primary" id="trace-button" type="button">Request trace</button>
      </div>
    </header>

    <div class="app">
      <aside class="rail" aria-label="Repository structures">
        <p class="rail-heading">Structure index</p>
        <nav id="structure-nav"></nav>
      </aside>

      <main class="stage" id="stage">
        <svg id="map" viewBox="0 0 1000 790" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Interactive isometric architecture map">
          <defs>
            <filter id="paper-shadow" x="-20%" y="-20%" width="150%" height="160%">
              <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#3b392f" flood-opacity="0.16"></feDropShadow>
            </filter>
            <pattern id="fine-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
              <line x1="0" y1="0" x2="0" y2="7" stroke="#27302d" stroke-opacity="0.09" stroke-width="1"></line>
            </pattern>
            <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#c54831"></path>
            </marker>
          </defs>
        </svg>
        <button class="control inside-back" id="inside-back" type="button">← Back to system</button>
        <div class="legend" aria-hidden="true"><span><i></i>runtime flow</span><span><i class="dashed"></i>advisory</span></div>
        <div class="trace-card" id="trace-card" aria-live="polite"></div>
      </main>

      <aside class="detail" id="detail" aria-live="polite"></aside>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <script>
  "use strict";

  /* ========================================================================
     DATA — REPLACE ONLY THIS SECTION FOR A NEW REPOSITORY

     STRUCTURES fields:
       id, code, name, group, loc, gx, gy, w, d, h, what, how, talks
       optional slab:true
       optional children:[{code,name,h,what}]

     EDGES fields:
       f, t, pay
       optional flow:1, dashed:1, via:[[gx,gy], ...]

     EXTERNALS fields:
       id, name, target, gx, gy, pay

     TRACE contains 10-14 [structureId, sentence] entries.
     Keep structure footprints disjoint and all IDs stable across updates.
     ======================================================================== */

  const SAMPLE_DATA = false;

  const TITLE = "How the Ticker Works";
  const SUBTITLE = "One live refresh path from provider data to 384x32 pixels";

  const STATS = [
    { value: "23,416", label: "source LOC" },
    { value: "27", label: "V2 endpoints" },
    { value: "10", label: "feature families" },
    { value: "384x32", label: "display pixels" }
  ];

  const GROUPS = [

  (function () {
    const NS = "http:" + "//www.w3.org/2000/svg";
    const VIEW_W = 1000;
    const VIEW_H = 790;
    const ORIGIN_X = 493;
    const ORIGIN_Y = 175;
    const ISO_X = 26;
    const ISO_Y = 14.3;
    const ISO_H = 16;

    const svg = document.getElementById("map");
    const nav = document.getElementById("structure-nav");
    const detail = document.getElementById("detail");
    const tooltip = document.getElementById("tooltip");
    const traceCard = document.getElementById("trace-card");
    const insideBack = document.getElementById("inside-back");
    const groupById = new Map(GROUPS.map((group) => [group.id, group]));
    const structureById = new Map(STRUCTURES.map((structure) => [structure.id, structure]));
    let selectedId = null;
    let insideId = null;
    let traceIndex = null;

    function esc(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function svgEl(name, attrs, text) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, String(value)));
      if (text !== undefined) node.textContent = String(text);
      return node;
    }

    function project(gx, gy, h) {
      return [ORIGIN_X + (gx - gy) * ISO_X, ORIGIN_Y + (gx + gy) * ISO_Y - h * ISO_H];
    }

    function points(values) {
      return values.map((point) => point.join(",")).join(" ");
    }

    function shade(hex, amount) {
      const raw = hex.replace("#", "");
      const value = parseInt(raw, 16);
      const r = Math.max(0, Math.min(255, (value >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((value >> 8) & 255) + amount));
      const b = Math.max(0, Math.min(255, (value & 255) + amount));
      return `rgb(${r},${g},${b})`;
    }

    function structureCenter(structure) {
      return {
        gx: structure.gx + structure.w / 2,
        gy: structure.gy + structure.d / 2
      };
    }

    function clearDrawing() {
      svg.querySelectorAll(".drawing-layer").forEach((node) => node.remove());
    }

    function makeLayer(name) {
      const layer = svgEl("g", { class: `drawing-layer ${name}` });
      svg.appendChild(layer);
      return layer;
    }

    function drawGround(layer) {
      for (let i = -5; i <= 24; i += 2) {
        const a = project(i, -4, 0);
        const b = project(i, 23, 0);
        layer.appendChild(svgEl("line", { class: "ground-line", x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
      }
      for (let i = -4; i <= 23; i += 2) {
        const a = project(-5, i, 0);
        const b = project(24, i, 0);
        layer.appendChild(svgEl("line", { class: "ground-line", x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
      }
    }

    function routeFor(edge) {
      const from = structureById.get(edge.f);
      const to = structureById.get(edge.t);
      if (!from || !to) return null;
      const start = structureCenter(from);
      const end = structureCenter(to);
      const logical = [
        [start.gx, start.gy],
        ...(edge.via || [[end.gx, start.gy]]),
        [end.gx, end.gy]
      ];
      const projected = logical.map(([gx, gy]) => project(gx, gy, 0.08));
      return `M ${projected.map((point) => `${point[0]} ${point[1]}`).join(" L ")}`;
    }

    function showTooltip(event, title, body) {
      tooltip.innerHTML = `<strong>${esc(title)}</strong><span>${esc(body)}</span>`;
      const left = Math.min(window.innerWidth - 270, event.clientX + 12);
      const top = Math.min(window.innerHeight - 120, event.clientY + 12);
      tooltip.style.left = `${Math.max(10, left)}px`;
      tooltip.style.top = `${Math.max(10, top)}px`;
      tooltip.classList.add("show");
    }

    function hideTooltip() {
      tooltip.classList.remove("show");
    }

    function drawEdges(layer) {
      EDGES.forEach((edge, index) => {
        const d = routeFor(edge);
        if (!d) return;
        const path = svgEl("path", {
          id: `flow-path-${index}`,
          class: `edge-line${edge.flow ? " flow" : ""}${edge.dashed ? " dashed" : ""}`,
          d,
          "data-from": edge.f,
          "data-to": edge.t
        });
        const hit = svgEl("path", { class: "edge-hit", d, tabindex: "0" });
        const describe = (event) => showTooltip(event, `${structureById.get(edge.f).name} → ${structureById.get(edge.t).name}`, edge.pay);
        hit.addEventListener("pointermove", describe);
        hit.addEventListener("pointerleave", hideTooltip);
        hit.addEventListener("focus", (event) => showTooltip({ clientX: window.innerWidth / 2, clientY: 120 }, "Data flow", edge.pay));
        hit.addEventListener("blur", hideTooltip);
        layer.appendChild(path);
        layer.appendChild(hit);

        if (edge.flow) {
          [0, 1].forEach((dotIndex) => {
            const circle = svgEl("circle", { class: "flow-dot", r: 3.5, "data-pay": edge.pay });
            const motion = svgEl("animateMotion", {
              path: d,
              dur: `${5.5 + (index % 4) * 0.8}s`,
              begin: `${dotIndex * -2.7}s`,
              repeatCount: "indefinite"
            });
            circle.appendChild(motion);
            circle.addEventListener("pointermove", (event) => showTooltip(event, "In transit", edge.pay));
            circle.addEventListener("pointerleave", hideTooltip);
            layer.appendChild(circle);
          });
        }
      });
    }

    function blockGeometry(structure) {
      const height = structure.slab ? Math.max(0.55, structure.h) : structure.h;
      const topA = project(structure.gx, structure.gy, height);
      const topB = project(structure.gx + structure.w, structure.gy, height);
      const topC = project(structure.gx + structure.w, structure.gy + structure.d, height);
      const topD = project(structure.gx, structure.gy + structure.d, height);
      const baseB = project(structure.gx + structure.w, structure.gy, 0);
      const baseC = project(structure.gx + structure.w, structure.gy + structure.d, 0);
      const baseD = project(structure.gx, structure.gy + structure.d, 0);
      return { height, topA, topB, topC, topD, baseB, baseC, baseD };
    }

    function drawBlock(layer, structure, options) {
      const settings = options || {};
      const group = groupById.get(structure.group) || { color: "#a69d88" };
      const color = settings.color || group.color;
      const geometry = blockGeometry(structure);
      const node = svgEl("g", {
        class: "structure",
        tabindex: "0",
        role: "button",
        "aria-label": `${structure.name}, ${structure.loc || "internal structure"}`,
        "data-id": structure.id
      });

      node.appendChild(svgEl("polygon", {
        class: "face right",
        points: points([geometry.topB, geometry.topC, geometry.baseC, geometry.baseB]),
        fill: shade(color, -36)
      }));
      node.appendChild(svgEl("polygon", {
        class: "face left",
        points: points([geometry.topC, geometry.topD, geometry.baseD, geometry.baseC]),
        fill: shade(color, -18)
      }));
      node.appendChild(svgEl("polygon", {
        class: "face top",
        points: points([geometry.topA, geometry.topB, geometry.topC, geometry.topD]),
        fill: color
      }));
      node.appendChild(svgEl("polygon", {
        points: points([geometry.topA, geometry.topB, geometry.topC, geometry.topD]),
        fill: "url(#fine-hatch)",
        "pointer-events": "none"
      }));

      const topCenter = project(structure.gx + structure.w / 2, structure.gy + structure.d / 2, geometry.height);
      node.appendChild(svgEl("text", { class: "block-code", x: topCenter[0], y: topCenter[1] - 2 }, structure.code));
      node.appendChild(svgEl("text", { class: "block-loc", x: topCenter[0], y: topCenter[1] + 11 }, structure.loc || ""));

      const activate = () => settings.onSelect ? settings.onSelect(structure) : selectStructure(structure.id);
      node.addEventListener("click", activate);
      node.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          activate();
        }
      });
      node.addEventListener("pointermove", (event) => {
        showTooltip(event, `${structure.name} · ${structure.loc || ""}`, structure.what);
        if (!settings.noNeighbors) highlightNeighborhood(structure.id);
      });
      node.addEventListener("pointerleave", () => {
        hideTooltip();
        if (!settings.noNeighbors) applyHighlightState();
      });
      node.addEventListener("focus", () => {
        if (!settings.noNeighbors) highlightNeighborhood(structure.id);
      });
      node.addEventListener("blur", () => {
        if (!settings.noNeighbors) applyHighlightState();
      });
      layer.appendChild(node);
      return node;
    }

    function drawExternals(layer) {
      EXTERNALS.forEach((external) => {
        const target = structureById.get(external.target);
        if (!target) return;
        const targetCenter = structureCenter(target);
        const start = project(external.gx, external.gy, 0.1);
        const end = project(targetCenter.gx, targetCenter.gy, 0.1);
        const width = Math.max(118, external.name.length * 7.2);
        const group = svgEl("g", { tabindex: "0", role: "note" });
        group.appendChild(svgEl("path", { class: "external-line", d: `M ${start[0]} ${start[1]} L ${end[0]} ${end[1]}` }));
        group.appendChild(svgEl("rect", { class: "external-card", x: start[0] - width / 2, y: start[1] - 18, width, height: 35, rx: 2 }));
        group.appendChild(svgEl("text", { class: "external-name", x: start[0], y: start[1] - 3, "text-anchor": "middle" }, external.name));
        group.appendChild(svgEl("text", { class: "external-pay", x: start[0], y: start[1] + 10, "text-anchor": "middle" }, external.pay));
        group.addEventListener("pointermove", (event) => showTooltip(event, external.name, external.pay));
        group.addEventListener("pointerleave", hideTooltip);
        layer.appendChild(group);
      });
    }

    function drawZoneLabels(layer) {
      const labels = GROUPS
        .filter(
          (group) =>
            Number.isFinite(group.labelGX)
            && Number.isFinite(group.labelGY)
        )
        .map((group) => [group.name.toUpperCase(), group.labelGX, group.labelGY]);

      labels.forEach(([label, gx, gy]) => {
        const at = project(gx, gy, 0);
        layer.appendChild(svgEl("text", { class: "zone-label", x: at[0], y: at[1], "text-anchor": "middle" }, label));
      });
    }

    function renderCity() {
      insideId = null;
      insideBack.classList.remove("show");
      clearDrawing();
      const ground = makeLayer("ground-layer");
      const edges = makeLayer("edge-layer");
      const blocks = makeLayer("block-layer");
      const externals = makeLayer("external-layer");
      drawGround(ground);
      drawZoneLabels(ground);
      drawEdges(edges);
      STRUCTURES
        .slice()
        .sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy))
        .forEach((structure) => drawBlock(blocks, structure));
      drawExternals(externals);
      applyHighlightState();
    }

    function renderInside(parent) {
      insideId = parent.id;
      selectedId = parent.id;
      traceIndex = null;
      traceCard.classList.remove("show");
      insideBack.classList.add("show");
      clearDrawing();
      const ground = makeLayer("ground-layer");
      const blocks = makeLayer("block-layer");
      drawGround(ground);

      ground.appendChild(svgEl("rect", { class: "inside-boundary", x: 130, y: 130, width: 740, height: 520, rx: 8 }));
      ground.appendChild(svgEl("text", { class: "inside-title", x: 165, y: 184 }, `Inside ${parent.name}`));
      ground.appendChild(svgEl("text", { class: "inside-note", x: 166, y: 207 }, "COMPONENT RESPONSIBILITIES · HEIGHTS FOLLOW RELATIVE SIZE"));

      const children = parent.children || [];
      const childStructures = children.map((child, index) => ({
        id: `${parent.id}-child-${index}`,
        code: child.code,
        name: child.name,
        group: parent.group,
        loc: child.loc || "internal",
        gx: 5 + (index % 3) * 5,
        gy: 8 + Math.floor(index / 3) * 6,
        w: 3,
        d: 2.4,
        h: child.h,
        what: child.what,
        how: parent.how,
        talks: []
      }));
      const insideEdges = makeLayer("inside-edge-layer");
      childStructures.slice(0, -1).forEach((from, index) => {
        const to = childStructures[index + 1];
        const start = structureCenter(from);
        const end = structureCenter(to);
        const startPoint = project(start.gx, start.gy, 0.1);
        const endPoint = project(end.gx, end.gy, 0.1);
        const d = `M ${startPoint[0]} ${startPoint[1]} L ${endPoint[0]} ${endPoint[1]}`;
        insideEdges.appendChild(svgEl("path", {
          class: "edge-line flow",
          d,
          "marker-end": "url(#flow-arrow)"
        }));
        const circle = svgEl("circle", { class: "flow-dot", r: 3.5 });
        circle.appendChild(svgEl("animateMotion", {
          path: d,
          dur: "3.5s",
          begin: `${index * -1.2}s`,
          repeatCount: "indefinite"
        }));
        insideEdges.appendChild(circle);
        const handoff = children[index].pay || "next step";
        const midpoint = [(startPoint[0] + endPoint[0]) / 2, (startPoint[1] + endPoint[1]) / 2 - 14];
        insideEdges.appendChild(svgEl("text", { class: "inside-flow-label", x: midpoint[0], y: midpoint[1] }, handoff));
      });
      childStructures.forEach((structure, index) => {
        const child = children[index];
        const column = index % 3;
        const row = Math.floor(index / 3);
        drawBlock(blocks, structure, {
          color: (groupById.get(parent.group) || { color: "#9d9480" }).color,
          noNeighbors: true,
          onSelect: () => renderChildDetail(parent, child)
        });
      });
      renderStructureDetail(parent);
      syncNav();
    }

    function highlightNeighborhood(id) {
      const neighbors = new Set([id]);
      EDGES.forEach((edge) => {
        if (edge.f === id) neighbors.add(edge.t);
        if (edge.t === id) neighbors.add(edge.f);
      });
      svg.querySelectorAll(".structure").forEach((node) => {
        node.classList.toggle("dimmed", !neighbors.has(node.dataset.id));
      });
      svg.querySelectorAll(".edge-line").forEach((node) => {
        node.classList.toggle("active", node.dataset.from === id || node.dataset.to === id);
      });
    }

    function applyHighlightState() {
      const active = traceIndex !== null ? TRACE[traceIndex][0] : selectedId;
      const completedIds = traceIndex !== null
        ? new Set(TRACE.slice(0, traceIndex + 1).map(([id]) => id))
        : new Set();
      const transitions = traceIndex !== null
        ? TRACE.slice(1, traceIndex + 1).map(([to], index) => [TRACE[index][0], to])
        : [];
      svg.querySelectorAll(".structure").forEach((node) => {
        const isCurrent = traceIndex !== null && node.dataset.id === active;
        const isComplete = traceIndex !== null && completedIds.has(node.dataset.id) && !isCurrent;
        node.classList.toggle("dimmed", traceIndex !== null && !completedIds.has(node.dataset.id));
        node.classList.toggle("active", traceIndex === null && node.dataset.id === active);
        node.classList.toggle("trace-complete", isComplete);
        node.classList.toggle("trace-current", isCurrent);
      });
      svg.querySelectorAll(".edge-line").forEach((node) => {
        let lastMatch = -1;
        transitions.forEach(([from, to], index) => {
          const matches = (node.dataset.from === from && node.dataset.to === to)
            || (node.dataset.from === to && node.dataset.to === from);
          if (matches) lastMatch = index;
        });
        node.classList.toggle("active", false);
        node.classList.toggle("trace-complete", lastMatch >= 0 && lastMatch < transitions.length - 1);
        node.classList.toggle("trace-current", lastMatch >= 0 && lastMatch === transitions.length - 1);
      });
      syncNav();
    }

    function syncNav() {
      nav.querySelectorAll(".structure-link").forEach((button) => {
        button.classList.toggle("active", button.dataset.id === selectedId);
      });
    }

    function renderNav() {
      nav.textContent = "";
      GROUPS.forEach((group) => {
        const members = STRUCTURES.filter((structure) => structure.group === group.id);
        if (!members.length) return;
        const section = document.createElement("section");
        section.className = "group";
        const title = document.createElement("p");
        title.className = "group-title";
        title.innerHTML = `<span class="swatch" style="background:${esc(group.color)}"></span>${esc(group.name)}`;
        section.appendChild(title);
        members.forEach((structure) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "structure-link";
          button.dataset.id = structure.id;
          button.style.setProperty("--chip", group.color);
          button.innerHTML = `<span class="code-chip">${esc(structure.code)}</span><span class="name">${esc(structure.name)}</span><span class="loc">${esc(structure.loc)}</span>`;
          button.addEventListener("click", () => {
            if (location.hash) history.replaceState(null, "", location.pathname + location.search);
            if (insideId) renderCity();
            traceIndex = null;
            traceCard.classList.remove("show");
            selectStructure(structure.id);
          });
          section.appendChild(button);
        });
        nav.appendChild(section);
      });
    }

    function renderOverview() {
      selectedId = null;
      detail.innerHTML = `
        <p class="eyebrow">System overview</p>
        <h2>${esc(TITLE)}</h2>
        <div class="detail-meta"><span>${STRUCTURES.length} structures</span><span>${EDGES.length} connections</span></div>
        <section class="detail-section"><h3>What it does</h3><p>${esc(OVERVIEW_WHAT)}</p></section>
        <section class="detail-section"><h3>How it's built</h3><p>${esc(OVERVIEW_HOW)}</p></section>
        <section class="detail-section"><h3>How to explore</h3><p>Hover blocks and moving dots for context. Select a structure for details. Request trace reveals a numbered path: orange marks completed steps and red marks the current step. Structures with internal components offer a go-inside view.</p></section>`;
      syncNav();
    }

    function renderStructureDetail(structure) {
      const group = groupById.get(structure.group);
      const connections = (structure.talks || [])
        .map((id) => structureById.get(id))
        .filter(Boolean);
      const connectionsHtml = connections.length
        ? `<ul>${connections.map((item) => `<li>${esc(item.name)}</li>`).join("")}</ul>`
        : `<p>No outgoing runtime connection is shown.</p>`;
      detail.innerHTML = `
        <p class="eyebrow">${esc(group ? group.name : "Structure")}</p>
        <h2>${esc(structure.name)}</h2>
        <div class="detail-meta"><span>${esc(structure.code)}</span><span>${esc(structure.loc)}</span>${structure.slab ? "<span>storage slab</span>" : ""}</div>
        <section class="detail-section"><h3>What it does</h3><p>${esc(structure.what)}</p></section>
        <section class="detail-section"><h3>How it's built</h3><p>${esc(structure.how)}</p></section>
        <section class="detail-section"><h3>Talks to</h3>${connectionsHtml}</section>
        ${structure.children && structure.children.length ? `<button class="inside-button" id="go-inside" type="button">Go inside · ${structure.children.length} components</button>` : ""}`;
      const insideButton = document.getElementById("go-inside");
      if (insideButton) insideButton.addEventListener("click", () => { location.hash = `inside=${encodeURIComponent(structure.id)}`; });
    }

    function renderChildDetail(parent, child) {
      detail.innerHTML = `
        <p class="eyebrow">Inside ${esc(parent.name)}</p>
        <h2>${esc(child.name)}</h2>
        <div class="detail-meta"><span>${esc(child.code)}</span><span>internal component</span></div>
        <section class="detail-section"><h3>What it does</h3><p>${esc(child.what)}</p></section>
        <section class="detail-section"><h3>Parent implementation</h3><p>${esc(parent.how)}</p></section>`;
    }

    function selectStructure(id) {
      const structure = structureById.get(id);
      if (!structure) return;
      selectedId = id;
      renderStructureDetail(structure);
      applyHighlightState();
    }

    function renderTrace(index) {
      const safeIndex = Math.max(0, Math.min(TRACE.length - 1, index));
      traceIndex = safeIndex;
      const [id, sentence] = TRACE[safeIndex];
      const structure = structureById.get(id);
      const traceStepsHtml = TRACE.map(([stepId], stepIndex) => {
        const stepStructure = structureById.get(stepId);
        const state = stepIndex === safeIndex ? " current" : (stepIndex < safeIndex ? " complete" : "");
        const label = stepStructure ? stepStructure.code : String(stepIndex + 1);
        const name = stepStructure ? stepStructure.name : stepId;
        return `<button class="trace-step${state}" type="button" data-trace-step="${stepIndex + 1}" aria-label="Go to trace step ${stepIndex + 1}: ${esc(name)}"><span class="trace-dot">${stepIndex + 1}</span><span class="trace-step-label">${esc(label)}</span></button>`;
      }).join("");
      selectedId = id;
      if (insideId) renderCity();
      traceCard.classList.add("show");
      traceCard.innerHTML = `
        <div class="trace-count"><small>Request trace</small><b>${String(safeIndex + 1).padStart(2, "0")} / ${String(TRACE.length).padStart(2, "0")}</b><span>Orange done · red current</span></div>
        <div class="trace-copy"><strong>${esc(structure ? structure.name : id)}</strong><span>${esc(sentence)}</span></div>
        <div class="trace-actions">
          <button type="button" data-trace-action="previous"${safeIndex === 0 ? " disabled" : ""}>← Previous</button>
          <button type="button" data-trace-action="next"${safeIndex === TRACE.length - 1 ? " disabled" : ""}>Next →</button>
          <button type="button" data-trace-action="close">Close</button>
        </div>
        <div class="trace-timeline" style="--trace-count:${TRACE.length}">${traceStepsHtml}</div>`;
      traceCard.querySelector('[data-trace-action="previous"]').addEventListener("click", () => setTrace(Math.max(1, safeIndex)));
      traceCard.querySelector('[data-trace-action="next"]').addEventListener("click", () => setTrace(Math.min(TRACE.length, safeIndex + 2)));
      traceCard.querySelector('[data-trace-action="close"]').addEventListener("click", () => { location.hash = ""; });
      traceCard.querySelectorAll("[data-trace-step]").forEach((button) => {
        button.addEventListener("click", () => setTrace(Number(button.dataset.traceStep)));
      });
      if (structure) renderStructureDetail(structure);
      applyHighlightState();
    }

    function setTrace(oneBasedIndex) {
      location.hash = `trace=${oneBasedIndex}`;
    }

    function applyHash() {
      // Debug hooks: #inside=STRUCTURE_ID and #trace=7.
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      const params = new URLSearchParams(location.hash.slice(1));
      const inside = params.get("inside");
      const trace = Number(params.get("trace"));
      if (inside) {
        const structure = structureById.get(inside);
        if (structure && structure.children && structure.children.length) {
          renderInside(structure);
          return;
        }
      }
      renderCity();
      if (Number.isFinite(trace) && trace >= 1) {
        renderTrace(trace - 1);
      } else {
        traceIndex = null;
        traceCard.classList.remove("show");
        renderOverview();
        applyHighlightState();
      }
    }

    document.getElementById("page-title").textContent = TITLE;
    document.getElementById("page-subtitle").textContent = SUBTITLE;
    document.title = TITLE;
    document.getElementById("stats").innerHTML = STATS.map((stat) => `<div class="stat"><strong>${esc(stat.value)}</strong><span>${esc(stat.label)}</span></div>`).join("");
    document.getElementById("overview-button").addEventListener("click", () => { location.hash = ""; });
    document.getElementById("trace-button").addEventListener("click", () => setTrace(1));
    insideBack.addEventListener("click", () => { location.hash = ""; });
    window.addEventListener("hashchange", applyHash);
    window.addEventListener("pointerdown", (event) => {
      if (!event.target.closest(".structure") && !event.target.closest(".structure-link") && !event.target.closest(".detail")) hideTooltip();
    });

    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    renderNav();
    applyHash();
    window.__isometricReady = true;
  }());
  </script>
</body>
</html>
