<svg xmlns="http://www.w3.org/2000/svg" width="4in" height="2in" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Sports Ticker identity label template</title>
  <desc id="description">Material-agnostic label with replaceable model, serial, ticker identifier, and pairing code fields.</desc>
  <rect width="1200" height="600" fill="#ffffff"/>
  <rect x="18" y="18" width="1164" height="564" rx="28" fill="none" stroke="#111827" stroke-width="6"/>
  <text x="64" y="98" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#111827">SPORTS TICKER</text>
  <text x="64" y="142" font-family="Arial, sans-serif" font-size="24" fill="#4b5563">{{MODEL}}  •  {{REVISION}}</text>

  <text x="64" y="218" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4b5563">TICKER ID</text>
  <text x="64" y="258" font-family="Arial, monospace" font-size="34" fill="#111827">{{TICKER_ID}}</text>

  <text x="64" y="326" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4b5563">SERIAL</text>
  <text x="64" y="366" font-family="Arial, monospace" font-size="34" fill="#111827">{{SERIAL}}</text>

  <text x="64" y="434" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4b5563">PAIR CODE</text>
  <text x="64" y="484" font-family="Arial, monospace" font-size="42" font-weight="700" letter-spacing="8" fill="#111827">{{PAIR_CODE}}</text>

  <rect x="820" y="88" width="270" height="270" fill="#f3f4f6" stroke="#9ca3af" stroke-width="3"/>
  <text x="955" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#6b7280">QR RESERVED</text>
  <text x="955" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">{{QR_PAYLOAD}}</text>
  <text x="820" y="420" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4b5563">SETUP</text>
  <text x="820" y="458" font-family="Arial, sans-serif" font-size="26" fill="#111827">{{SETUP_URL}}</text>
  <text x="820" y="510" font-family="Arial, sans-serif" font-size="20" fill="#4b5563">Use the app to connect</text>
</svg>
