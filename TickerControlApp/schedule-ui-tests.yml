name: ScheduleUI
options:
  deploymentTarget:
    iOS: "18.6"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
targets:
  SchedulePreview:
    type: application
    platform: iOS
    sources:
      - path: TickerControl
        excludes: ["**/*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.ticker.schedule-preview
        INFOPLIST_FILE: TickerControl-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  ScheduleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScheduleUITests]
    dependencies:
      - target: SchedulePreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.ticker.schedule-ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SchedulePreview
schemes:
  ScheduleUI:
    build:
      targets:
        SchedulePreview: all
        ScheduleUITests: [test]
    test:
      targets:
        - name: ScheduleUITests
          parallelizable: false
