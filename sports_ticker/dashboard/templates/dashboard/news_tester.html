<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Banner Tester</title>
<style>
  :root {
    --bg:#0d0f13; --panel:#171b22; --line:#262c36;
    --text:#e6e9ef; --dim:#8b93a3; --ok:#3ddc84; --bad:#ff6b6b; --amber:#ffb020; --cyan:#46afff;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:780px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
  select, input { width:100%; padding:9px 10px; background:#0f1319; color:var(--text);
                  border:1px solid var(--line); border-radius:6px; font-size:14px; font-family:inherit; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1 1 130px; }
  .presets { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
  button { width:100%; padding:12px 10px; border:1px solid var(--line); border-radius:8px;
           background:#1e242e; color:var(--text); font:600 14px inherit; cursor:pointer; text-align:left; }
  button:hover { border-color:var(--amber); }
  button:disabled { opacity:.5; cursor:default; }
  button .hl { display:block; font-weight:400; font-size:12px; color:var(--dim); margin-top:2px; }
  .tag { display:inline-block; padding:1px 6px; border-radius:3px; font-size:11px; font-weight:700;
         color:#14171c; margin-right:6px; }
  .tag.trade { background:var(--amber); }
  .tag.news { background:var(--cyan); }
  .send { background:var(--amber); color:#14171c; text-align:center; border-color:var(--amber); margin-top:12px; }
  pre { margin:0; padding:12px; background:#0b0e12; border:1px solid var(--line); border-radius:6px;
        font:12px/1.5 ui-monospace,Consolas,monospace; white-space:pre-wrap; word-break:break-word;
        max-height:300px; overflow:auto; }
  .banner { padding:10px 12px; border-radius:6px; font-size:14px; margin-bottom:10px; display:none; }
  .banner.ok { display:block; background:rgba(61,220,132,.12); border:1px solid var(--ok); color:var(--ok); }
  .banner.bad { display:block; background:rgba(255,107,107,.12); border:1px solid var(--bad); color:var(--bad); }
  .note { color:var(--dim); font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>News Banner Tester</h1>
  <div class="sub">Each button pushes one banner. It uses the same store, gating, and delay as a real trade read from a league feed.</div>

  <div class="card">
    <label for="ticker">Ticker</label>
    <select id="ticker">
      {% for t in tickers %}
      <option value="{{ t.id }}">{{ t.name }} — {{ t.mode }}{% if t.teams %} — {{ t.teams }}{% endif %}</option>
      {% endfor %}
      {% if not tickers %}<option value="">No paired ticker found</option>{% endif %}
    </select>
    <div class="note">A trade needs a sports mode and a followed club. Stock news needs stocks mode.</div>
  </div>

  <div class="card">
    <label>Presets</label>
    <div class="presets">
      {% for p in presets %}
      <button class="preset" data-body='{{ p.body }}'>
        <span class="tag {{ p.css }}">{{ p.kind }}</span>{{ p.label }}
        <span class="hl">{{ p.detail }}</span>
      </button>
      {% endfor %}
    </div>
  </div>

  <div class="card">
    <label>Custom trade</label>
    <div class="row">
      <div><label for="sport">League</label>
        <select id="sport"><option>nhl</option><option>nba</option><option>nfl</option><option>mlb</option></select>
      </div>
      <div><label for="kind">Kind</label>
        <select id="kind"><option>TRADE</option><option>SIGNS</option></select>
      </div>
      <div><label for="from">From</label><input id="from" value="VAN"></div>
      <div><label for="to">To</label><input id="to" value="NYR"></div>
    </div>
    <div style="margin-top:10px">
      <label for="text">Detail</label>
      <input id="text" value="J.T. Miller for Kakko and a 2027 first">
    </div>
    <button class="send" id="send">Push this banner</button>
  </div>

  <div class="card">
    <label>Response</label>
    <div class="banner" id="banner"></div>
    <pre id="out">Push a banner to see the response.</pre>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);

  async function push(body) {
    const ticker = $('ticker').value;
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const res = await fetch('/api/news', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      show(await res.json(), ticker);
    } catch (err) {
      fail('Request failed: ' + err.message);
    } finally {
      document.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  function fail(msg) {
    const b = $('banner');
    b.className = 'banner bad';
    b.textContent = msg;
  }

  function show(data, ticker) {
    const b = $('banner');
    $('out').textContent = JSON.stringify(data, null, 2);
    if (data.status === 'error') { fail(data.message); return; }
    const following = (data.tickers_following || []).includes(ticker);
    b.className = following ? 'banner ok' : 'banner bad';
    const item = data.item || {};
    b.textContent = following
      ? `Pushed ${item.from_abbr} to ${item.to_abbr}. It shows on the selected ticker in a matching mode.`
      : `Pushed, but the selected ticker does not follow ${item.from_abbr} or ${item.to_abbr}, so it will not appear there.`;
  }

  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => push(JSON.parse(btn.dataset.body)));
  });

  $('send').addEventListener('click', () => push({
    kind: $('kind').value, sport: $('sport').value,
    from: $('from').value, to: $('to').value, text: $('text').value,
  }));
</script>
</body>
</html>
