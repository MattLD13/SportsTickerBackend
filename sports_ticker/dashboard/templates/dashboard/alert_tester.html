<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Alert Tester</title>
<style>
  :root {
    --bg: #0d0f13; --panel: #171b22; --line: #262c36;
    --text: #e6e9ef; --dim: #8b93a3; --ok: #3ddc84; --bad: #ff6b6b; --accent: #ffb020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  select, input {
    width: 100%; padding: 9px 10px; background: #0f1319; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font-size: 14px; font-family: inherit;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1 1 150px; }
  .teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; }
  button {
    width: 100%; padding: 12px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: #1e242e; color: var(--text); font: 600 14px inherit; cursor: pointer; text-align: left;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button .hl { display: block; font-weight: 400; font-size: 12px; color: var(--dim); margin-top: 2px; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: baseline; }
  .send { background: var(--accent); color: #14171c; text-align: center; border-color: var(--accent); margin-top: 12px; }
  pre { margin: 0; padding: 12px; background: #0b0e12; border: 1px solid var(--line); border-radius: 6px;
        font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  .banner { padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 10px; display: none; }
  .banner.ok { display: block; background: rgba(61,220,132,.12); border: 1px solid var(--ok); color: var(--ok); }
  .banner.bad { display: block; background: rgba(255,107,107,.12); border: 1px solid var(--bad); color: var(--bad); }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  code { background: #0b0e12; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Score Alert Tester</h1>
  <div class="sub">Each button sends one synthetic alert. The alert uses the same buffer, gating, and delay as a real one.</div>

  <div class="card">
    <label for="ticker">Ticker</label>
    <select id="ticker">
      {% for t in tickers %}
      <option value="{{ t.id }}">{{ t.name }} — {{ t.mode }}{% if t.teams %} — {{ t.teams }}{% endif %}</option>
      {% endfor %}
      {% if not tickers %}<option value="">No paired ticker found</option>{% endif %}
    </select>
    <div class="note">Alerts reach a ticker only in a sports mode, and only for a team in its My Teams list.</div>
  </div>

  <div class="card">
    <label>Presets</label>
    <div class="teams">
      {% for p in presets %}
      <button class="preset"
              data-team="{{ p.team }}" data-headline="{{ p.headline }}"
              data-detail="{{ p.detail }}" data-status="{{ p.status }}">
        <span class="swatch" style="background: {{ p.color }}"></span>{{ p.name }}
        <span class="hl">{{ p.headline }} · {{ p.detail }}</span>
      </button>
      {% endfor %}
    </div>
  </div>

  <div class="card">
    <label>Custom alert</label>
    <div class="row">
      <div><label for="team">Team</label><input id="team" value="mlb:STL" placeholder="league:ABBR"></div>
      <div><label for="status">Status</label><input id="status" value="Bottom 9" placeholder="Bottom 9"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="headline">Headline</label><input id="headline" value="WALK-OFF" placeholder="GRAND SLAM"></div>
      <div><label for="detail">Scorer</label><input id="detail" value="GOLDSCHMIDT" placeholder="JUDGE"></div>
    </div>
    <button class="send" id="send">Send custom alert</button>
  </div>

  <div class="card">
    <label>Response</label>
    <div class="banner" id="banner"></div>
    <pre id="out">Send an alert to see the response.</pre>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  async function send(params) {
    const ticker = $('ticker').value;
    if (!ticker) { show(null, 'No ticker is paired with this server.'); return; }
    const query = new URLSearchParams({ id: ticker, ...params });
    document.querySelectorAll('button').forEach(b => b.disabled = true);
    try {
      const res = await fetch('/api/debug/score_alert?' + query.toString());
      show(await res.json(), null);
    } catch (err) {
      show(null, 'Request failed: ' + err.message);
    } finally {
      document.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  }

  function show(data, error) {
    const banner = $('banner');
    if (error) {
      banner.className = 'banner bad';
      banner.textContent = error;
      $('out').textContent = '';
      return;
    }
    if (data.will_display) {
      banner.className = 'banner ok';
      const wait = data.delay_seconds
        ? ' Live delay is ' + data.delay_seconds + 's, so it appears in about ' + (data.delay_seconds + 1) + 's.'
        : ' It appears in about 1s.';
      banner.textContent = 'Sent ' + data.alert.headline + ' for ' + data.alert.team_abbr + '.' + wait;
    } else {
      banner.className = 'banner bad';
      banner.textContent = 'Blocked: ' + (data.blocked_by || ['unknown']).join(' · ');
    }
    $('out').textContent = JSON.stringify(data, null, 2);
  }

  document.querySelectorAll('.preset').forEach(btn => {
    btn.addEventListener('click', () => send({
      team: btn.dataset.team, headline: btn.dataset.headline,
      detail: btn.dataset.detail, status: btn.dataset.status,
    }));
  });

  $('send').addEventListener('click', () => send({
    team: $('team').value, headline: $('headline').value,
    detail: $('detail').value, status: $('status').value,
  }));
</script>
</body>
</html>
