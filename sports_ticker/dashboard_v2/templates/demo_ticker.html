<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsTicker — live demo</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('dashboard_v2.static', filename='style.css', v=version_hash) }}">
</head>
<body class="demo-page">
<div class="demo" data-ticker-demo data-demo-music="sample" data-autorotate="true" data-scroll-rate="{{ scroll_px_s }}" data-modes='{{ demo_modes | tojson }}'>
  <div class="demo-page-head"><p class="lede">The board, live at <span data-led data-led-inline data-led-scale="2" data-led-pad="0" data-led-color="amber">{{ panel_w }}X{{ panel_h }}</span></p></div>
  <div class="panel-stage"><div class="panel"><div class="demo-vp" data-demo-vp><div class="demo-status">CONNECTING TO TICKER...</div></div></div></div>
  <div class="demo-controls" data-demo-controls></div>
  <div class="demo-page-foot"><a class="btn btn-ghost" href="/">Back to SportsTicker</a></div>
</div>
<script src="{{ url_for('dashboard_v2.static', filename='led.js', v=version_hash) }}"></script>
<script src="{{ url_for('dashboard_v2.static', filename='ticker-demo.js', v=version_hash) }}"></script>
</body>
</html>
